limit_req_zone $binary_remote_addr zone=demo_requests:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=demo_connections:10m;
limit_req_zone $binary_remote_addr zone=workspace_creation:1m rate=1r/m;

server {
    listen 80;
    server_name _;
    # Relative assets and API also work when the public URL has no trailing slash.
    sub_filter '<head>' '<head><base href="${PUBLIC_BASE_PATH}">';
    sub_filter_once on;
    if ($host ~* "\.trycloudflare\.com$") {
        return 308 ${PUBLIC_URL}$request_uri;
    }

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $sentinel_backend api:8000;

    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 15s;
    keepalive_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn demo_connections 12;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    location ^~ /api/admin/ { return 404; }
    # External imports are operator tools; they are not part of the public demo API.
    location ~ ^/api/workspaces/[^/]+/imports/?$ { return 404; }

    location = /api/workspaces {
        limit_req zone=workspace_creation burst=3 nodelay;
        proxy_pass http://$sentinel_backend$request_uri;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
    }

    location /api/ {
        limit_req zone=demo_requests burst=15 nodelay;
        proxy_pass http://$sentinel_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 80s;
        proxy_send_timeout 10s;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
    }

    location /api/workspaces/ {
        client_max_body_size 3m;
        limit_req zone=demo_requests burst=15 nodelay;
        proxy_pass http://$sentinel_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 80s;
        proxy_send_timeout 10s;
        proxy_hide_header Content-Security-Policy;
    }

    location = /ready { proxy_pass http://$sentinel_backend$request_uri; }

    location = /health {
        proxy_pass http://$sentinel_backend$request_uri;
    }

    location = /docs { return 302 ./openapi.json; }
    location = /openapi.json { proxy_pass http://$sentinel_backend$request_uri; }
}
