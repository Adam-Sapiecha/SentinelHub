name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Browser dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm run test:sentinel-script
      - name: Browser smoke
        env:
          APP_MODE: application
        run: |
          python -m uvicorn src.main:app --host 127.0.0.1 --port 8765 > /tmp/sentinelhub-uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health && break || sleep 1; done
          pnpm run test:browser
          DEMO_URL=http://127.0.0.1:8765 pnpm run test:workspace
          DEMO_URL=http://127.0.0.1:8765 pnpm run test:recruiter

  containers:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      COMPOSE_PROJECT_NAME: sentinelhub-ci
      DEMO_PORT: "8090"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Check real ingress
        run: VERIFY_CONTAINER_RESTART=1 python tests/container_smoke.py
      - name: Validate Nginx and unprivileged API
        run: |
          docker compose exec -T web nginx -t
          docker compose exec -T api python -c 'import os; assert os.getuid() != 0'
      - name: Logs
        if: always()
        run: docker compose logs --tail 100
      - name: Stop project
        if: always()
        run: docker compose down
